; PlatformIO Project Configuration File
;
; This is a multi-firmware monorepo: one PlatformIO project, one environment
; per physical ESP32 board (tractor, seeder, dispenser). Pick which firmware
; to build/upload with `-e <env>`, e.g.:
;
;   pio run -e tractor -t upload
;   pio run -e seeder -t upload
;   pio run -e dispenser -t upload
;
; In VS Code (PlatformIO extension), switch the active environment from the
; status bar at the bottom, or expand the PlatformIO sidebar's Project Tasks
; tree and pick the env there.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = tractor, seeder, dispenser, dispenser_bench

[env]
; Pinned: espressif32 7.0.1 bundles Arduino-ESP32 core 2.0.17, matching the
; 2.0.11 core this project was originally built against in Arduino IDE.
; Do NOT bump past the Arduino-ESP32 2.x line without reviewing the ESP-NOW
; callback signatures first — core 3.x (IDF5) changes OnDataRecv's signature
; and will break both tractor and seeder builds.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200

upload_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Each environment restricts the build to its own src/<board>/ subfolder via
; build_src_filter. (Plain per-env `src_dir` is NOT honored by PlatformIO for
; this — it's silently ignored and every environment would otherwise compile
; all three boards' main.cpp files together.)

; Adafruit_SH1106 is vendored (patched for ESP32) in lib/Adafruit_SH1106
; rather than pulled from git — see lib/Adafruit_SH1106/README.md for why.
[env:tractor]
build_src_filter = +<tractor/*>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9

[env:seeder]
build_src_filter = +<seeder/*>

[env:dispenser]
build_src_filter = +<dispenser/*>

[env:dispenser_bench]
; Bench test image for the dispenser module (docs/dispenser_module_hardware.md §6). Never fit a module running this.
; It compiles the bench folder plus the shared dispenser I/O, and not src/dispenser/main.cpp.
build_src_filter = +<dispenser_bench/*> +<dispenser/dispenser_io.cpp>
